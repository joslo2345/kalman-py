<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-labelledby="title">
  <title id="title">kalman-py logo: an estimate track through noisy measurements with its uncertainty ellipse</title>
  <!-- Prior uncertainty: large faint ellipse; posterior: smaller, sharper ellipse -->
  <ellipse cx="96" cy="64" rx="44" ry="24" transform="rotate(-32 96 64)" fill="#3987e5" fill-opacity="0.12" stroke="#3987e5" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="5 5"/>
  <ellipse cx="96" cy="64" rx="22" ry="11" transform="rotate(-32 96 64)" fill="#3987e5" fill-opacity="0.28" stroke="#3987e5" stroke-width="3"/>
  <!-- Noisy measurements -->
  <g fill="#8b8a85">
    <circle cx="22" cy="132" r="4.5"/>
    <circle cx="44" cy="104" r="4.5"/>
    <circle cx="56" cy="122" r="4.5"/>
    <circle cx="78" cy="88" r="4.5"/>
    <circle cx="112" cy="76" r="4.5"/>
    <circle cx="128" cy="38" r="4.5"/>
  </g>
  <!-- Filtered estimate -->
  <path d="M16 140 C 44 120, 62 104, 96 64 S 132 30, 146 22" fill="none" stroke="#eb6834" stroke-width="6" stroke-linecap="round"/>
  <circle cx="96" cy="64" r="6.5" fill="#eb6834" stroke="#ffffff" stroke-width="2.5"/>
</svg>
