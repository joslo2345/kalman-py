[project]
name = "kalman-py"
version = "0.1.0"
description = "Fast, modern Kalman filters for Python with an optional JAX backend"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jose Lopez", email = "joslo2345contact@gmail.com" }
]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
jax = ["jax>=0.4"]
plot = ["matplotlib>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
extend-exclude = ["kalman-python-repo-guide.md"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# Benchmark and scenario tooling: not part of the typed library.
module = ["benchmarks.*", "scripts.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["filterpy.*", "pykalman.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["slow: long-running comparison tests"]
addopts = "-m 'not slow'"

[dependency-groups]
dev = [
    "filterpy>=1.4.5",
    "hypothesis>=6.168.5",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "mypy>=2.4.0",
    "pykalman>=0.11.2",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "scipy>=1.15.3",
]
