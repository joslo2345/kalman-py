[project]
name = "kalman-py"
version = "0.1.1"
description = "Fast, exact and numerically robust Kalman filters for Python: KF, EKF, UKF, RTS smoothers, noise learning and diagnostics on NumPy or JAX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jose Lopez", email = "joslo2345contact@gmail.com" }
]
requires-python = ">=3.10"
# Floors are the versions tested (CI "minimum versions" job): numpy 1.24, jax 0.4.30.
dependencies = ["numpy>=1.24"]
keywords = [
    "kalman filter",
    "extended kalman filter",
    "unscented kalman filter",
    "rts smoother",
    "state estimation",
    "sensor fusion",
    "tracking",
    "jax",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/joslo2345/kalman-py"
Documentation = "https://joslo2345.github.io/kalman-py/"
Repository = "https://github.com/joslo2345/kalman-py"
Issues = "https://github.com/joslo2345/kalman-py/issues"
Changelog = "https://github.com/joslo2345/kalman-py/blob/main/CHANGELOG.md"

[project.optional-dependencies]
jax = ["jax>=0.4.30"]
plot = ["matplotlib>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# The library, its tests and the docs that ship with it. Benchmark scenario data (15 MB),
# benchmarks, results, docs site sources and notebooks stay in the repository; tests that need
# them skip when they're absent.
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]
exclude = ["/tests/vectors"]

[tool.ruff]
line-length = 100
extend-exclude = ["kalman-python-repo-guide.md"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# Benchmark and scenario tooling: not part of the typed library.
module = ["benchmarks.*", "scripts.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["filterpy.*", "pykalman.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["slow: long-running comparison tests"]
addopts = "-m 'not slow'"

[dependency-groups]
dev = [
    "filterpy>=1.4.5",
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pykalman>=0.11.2",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "scipy>=1.15.3",
]
docs = [
    "ipykernel>=7.3.0",
    "jupytext>=1.19.6",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "nbclient>=0.11.0",
]
